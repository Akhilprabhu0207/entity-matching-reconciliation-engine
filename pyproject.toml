[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "entity-matching-reconciliation-engine"
version = "1.0.0"
description = "Explainable fund/security entity matching and exception reporting"
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3", "rapidfuzz==3.14.3", "openpyxl==3.1.5"]
[project.optional-dependencies]
test = ["pytest==9.0.2"]
[project.scripts]
entity-match = "entity_reconciliation.cli:main"
[tool.pytest.ini_options]
pythonpath=["src"]
